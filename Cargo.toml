[package]
name = "typeforge"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Oleksandr Mysak"]
description = "Terminal typing practice with real, attributed source code"
license = "MIT"
readme = "README.md"
homepage = "https://github.com/rzssh/typeforge"
repository = "https://github.com/rzssh/typeforge"
keywords = ["typing", "terminal", "tui", "tree-sitter", "practice"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
rand = "0.8"
dirs = "5"
sha2 = "0.10"
ureq = { version = "3", features = ["json"] }
tree-sitter = "0.25"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.25"
tree-sitter-swift = "0.7"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-cpp = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-java = "0.23"
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }

[profile.release]
lto = "thin"
strip = "symbols"
